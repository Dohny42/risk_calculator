[project]
name = "risk_calculator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Dohny42", email = "dohny42@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
risk-calculator = { workspace = true, editable = true }

[dependency-groups]
dev = ["risk-calculator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
